<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#A78BFA">
<title>ZUPI — Bounce. Play. Repeat.</title>
<style>:root{
  --coral:#FF6B6B; --sunny:#FFD166; --blue:#56CFE1; --mint:#8BD17C; --purple:#A78BFA; --cream:#FFF8E8; --ink:#25264A;
  --font:"Baloo 2","Fredoka","Nunito","Trebuchet MS","Arial Rounded MT Bold",system-ui,sans-serif;
  --hud-h:56px;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px); --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:var(--ink);overflow:hidden;overscroll-behavior:none;touch-action:none;font-family:var(--font);color:var(--ink)}
#app{position:fixed;inset:0}
canvas#game{position:absolute;left:0;top:0;width:100%;height:100%;display:block;touch-action:none}
#app.playing canvas#game{top:calc(var(--safe-t) + var(--hud-h));height:calc(100% - var(--safe-t) - var(--hud-h))}
#app.playing{background:var(--ink)}
.hidden{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button{}
button:focus-visible{outline:4px solid var(--blue);outline-offset:3px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;min-height:52px;padding:.35em 1.4em;border-radius:20px;font-weight:800;font-size:clamp(18px,2.6vh,24px);
  background:var(--sunny);color:var(--ink);border:3px solid var(--ink);box-shadow:0 6px 0 var(--ink);transition:transform .08s,box-shadow .08s,filter .15s;letter-spacing:.02em}
.btn{position:relative;overflow:hidden}
.btn::after{content:"";position:absolute;left:10%;right:10%;top:3px;height:32%;border-radius:20px;background:linear-gradient(rgba(255,255,255,.55),rgba(255,255,255,0));pointer-events:none}
.btn:hover{filter:brightness(1.07);transform:translateY(-2px) scale(1.035) rotate(-.6deg)}
.btn.big{animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.045)}}
.btn.big:hover{animation:none}
.btn:active,.btn.down{transform:translateY(5px) scale(.97,.94);box-shadow:0 1px 0 var(--ink);animation:none}
.btn{white-space:nowrap}
#l-back{align-self:center}
.btn.coral{background:var(--coral);color:#fff}.btn.blue{background:var(--blue)}.btn.mint{background:var(--mint)}.btn.purple{background:var(--purple);color:#fff}.btn.cream{background:var(--cream)}
.btn.big{min-height:76px;font-size:clamp(28px,5vh,42px);padding:.2em 1.8em;border-radius:28px;box-shadow:0 8px 0 var(--ink)}
.btn.big:active{transform:translateY(7px) scale(.97,.93);box-shadow:0 1px 0 var(--ink)}
.btn.round{width:54px;min-width:54px;padding:0;border-radius:50%;font-size:22px}
.btn[disabled]{opacity:.5;pointer-events:none}

/* ---------- screens ---------- */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(10px,2vh,22px);padding:calc(var(--safe-t) + 16px) 16px calc(var(--safe-b) + 16px);text-align:center;animation:pop .35s cubic-bezier(.2,1.4,.4,1) both}
.screen.dim{background:rgba(37,38,74,.62);backdrop-filter:blur(3px)}
@keyframes pop{from{opacity:0;transform:scale(.92) translateY(14px)}to{opacity:1;transform:none}}
.panel{background:var(--cream);border:4px solid var(--ink);border-radius:30px;box-shadow:0 10px 0 rgba(37,38,74,.9);padding:clamp(16px,3vh,30px) clamp(18px,4vw,42px);display:flex;flex-direction:column;align-items:center;gap:clamp(10px,1.8vh,16px);max-width:min(92vw,560px);max-height:92vh;overflow:auto}
h1,h2,h3,p{margin:0}
h2{font-size:clamp(28px,5vh,44px);font-weight:900;color:var(--ink);line-height:1}
.sub{font-weight:700;opacity:.75;font-size:clamp(14px,2.2vh,18px)}

/* ---------- logo ---------- */
.logo{display:flex;gap:.02em;font-size:clamp(78px,17vh,150px);font-weight:900;line-height:.9;filter:drop-shadow(0 8px 0 rgba(37,38,74,.35))}
.logo span{display:inline-block;color:var(--c);-webkit-text-stroke:.07em var(--ink);paint-order:stroke fill;text-shadow:0 .06em 0 var(--ink);animation:bob 1.6s ease-in-out infinite;animation-delay:calc(var(--i)*.14s)}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg) scale(1,1)}45%{transform:translateY(-.14em) rotate(2deg) scale(.96,1.06)}60%{transform:translateY(0) rotate(0) scale(1.08,.9)}}
.tagline{font-size:clamp(18px,3.4vh,28px);font-weight:900;color:var(--cream);text-shadow:0 3px 0 var(--ink),0 0 14px rgba(37,38,74,.5);-webkit-text-stroke:.5px var(--ink);letter-spacing:.06em}
#mascot{width:clamp(110px,24vh,200px);height:clamp(110px,24vh,200px);margin:-6px 0}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;align-items:center}
.col{display:flex;flex-direction:column;gap:14px;align-items:stretch;width:min(86vw,340px)}

/* ---------- level select ---------- */
#levels .panel{width:min(94vw,760px);align-items:stretch}
.world{display:flex;flex-direction:column;gap:8px}
.world h3{font-size:clamp(18px,2.8vh,24px);font-weight:900;text-align:left;display:flex;align-items:center;gap:8px}
.world h3 i{width:14px;height:14px;border-radius:50%;background:var(--c);border:2.5px solid var(--ink);display:inline-block}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{position:relative;background:#fff;border:3px solid var(--ink);border-radius:20px;padding:10px 10px 12px;box-shadow:0 5px 0 var(--ink);display:flex;flex-direction:column;align-items:center;gap:4px;transition:transform .1s,box-shadow .1s}
.card:not([disabled]):hover{transform:translateY(-4px) rotate(-1.2deg) scale(1.03);box-shadow:0 9px 0 var(--ink)}
.card:not([disabled]):active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.card .num{font-size:30px;font-weight:900;line-height:1;color:var(--c,var(--coral));-webkit-text-stroke:1.5px var(--ink);paint-order:stroke fill}
.card .nm{font-weight:800;font-size:15px;line-height:1.1;min-height:2.2em;display:flex;align-items:center}
.card[disabled]{opacity:.55;filter:grayscale(.5);cursor:not-allowed}
.card .lock{position:absolute;top:8px;right:10px;font-size:18px}
.stars{display:flex;gap:3px}.stars svg{width:24px;height:24px}
.stars .on path{fill:var(--sunny)}.stars .off path{fill:#E2DDD0}.stars path{stroke:var(--ink);stroke-width:2.4;stroke-linejoin:round}

/* ---------- settings ---------- */
.setting{display:flex;align-items:center;gap:14px;width:100%;justify-content:space-between;font-weight:800;font-size:18px}
.setting input[type=range]{width:min(34vw,170px);accent-color:var(--coral);height:28px}
.switch{width:62px;height:34px;border-radius:20px;background:#cfc9b8;border:3px solid var(--ink);position:relative;transition:background .15s;flex:none}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:var(--cream);border:3px solid var(--ink);transition:transform .15s}
.switch[aria-checked=true]{background:var(--mint)}.switch[aria-checked=true]::after{transform:translateX(28px)}
.keys{font-weight:700;font-size:15px;line-height:1.6;text-align:left;width:100%;background:#fff;border:3px dashed rgba(37,38,74,.35);border-radius:16px;padding:10px 14px}
kbd{background:var(--cream);border:2px solid var(--ink);border-bottom-width:4px;border-radius:7px;padding:0 6px;font:inherit;font-size:13px;font-weight:900}

/* ---------- HUD (top strip, outside the play field) ---------- */
#hud{position:absolute;left:0;right:0;top:0;pointer-events:none}
#hud .bar{height:calc(var(--safe-t) + var(--hud-h));padding:var(--safe-t) calc(var(--safe-r) + 10px) 0 calc(var(--safe-l) + 10px);display:flex;align-items:center;gap:8px;justify-content:space-between;
  background:linear-gradient(#34356B,var(--ink));border-bottom:3px solid #14152E}
#hud .pill{pointer-events:none;display:inline-flex;align-items:center;gap:6px;background:var(--cream);border:2.5px solid var(--ink);border-radius:16px;padding:2px 12px;font-weight:900;font-size:clamp(14px,2.3vh,19px);box-shadow:0 3px 0 rgba(0,0,0,.35);white-space:nowrap;line-height:1.5}
#hud .left{display:flex;gap:7px;align-items:center;min-width:0}
#hud .right{display:flex;gap:8px;pointer-events:auto}
#hud .mid{flex:1;min-width:0;display:flex;justify-content:center;align-items:center;position:relative;height:100%}
#hud .btn.round{width:42px;min-width:42px;min-height:42px;font-size:17px;box-shadow:0 3px 0 rgba(0,0,0,.45);border-width:2.5px}
.pill svg{width:20px;height:20px;flex:none}
.pill.skull{background:#FFD9D6}.pill.skull svg{background:none}.pill.gem svg path{fill:var(--purple)}
.pill.pop{animation:pillpop .35s}
@keyframes pillpop{40%{transform:scale(1.25) rotate(-3deg)}}
#objective{font-size:clamp(12px,2vh,16px)!important;padding:1px 10px!important;background:var(--sunny)!important}
#objective:empty{display:none}
#hud.toasting #objective{visibility:hidden}
#objective.done{background:var(--mint)!important}
#tip{position:absolute;left:50%;top:calc(var(--safe-t) + var(--hud-h) + 8px);transform:translateX(-50%);display:flex;align-items:center;gap:8px;max-width:min(88vw,340px);width:max-content;
  background:rgba(255,248,232,.94);border:3px solid var(--ink);border-radius:16px;padding:5px 6px 5px 10px;font-weight:800;font-size:clamp(13px,2.1vh,16px);line-height:1.2;box-shadow:0 4px 0 rgba(37,38,74,.55);pointer-events:none;animation:tipin .3s cubic-bezier(.2,1.5,.4,1) both}
#tip.out{animation:tipout .25s ease both}
#tip .ic{font-size:16px}
#tip button{pointer-events:auto;flex:none;width:28px;height:28px;border-radius:50%;background:var(--coral);color:#fff;border:2.5px solid var(--ink);font-weight:900;font-size:17px;line-height:1;display:flex;align-items:center;justify-content:center}
@keyframes tipin{from{opacity:0;transform:translate(-50%,-10px) scale(.9)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes tipout{to{opacity:0;transform:translate(-50%,-8px) scale(.95)}}
#toast{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:clamp(18px,3.6vh,28px);font-weight:900;color:var(--cream);-webkit-text-stroke:.05em var(--ink);paint-order:stroke fill;text-shadow:0 .06em 0 var(--ink);pointer-events:none;opacity:0;white-space:nowrap}
#toast.show{animation:toast .9s ease both}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}18%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}30%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%)}}
@media (max-width:560px),(max-height:430px){:root{--hud-h:46px}#hud-level .nm{display:none}#hud .pill{padding:1px 9px;font-size:14px}#hud .btn.round{width:36px;min-width:36px;min-height:36px;font-size:15px}.pill svg{width:17px;height:17px}#objective{display:none!important}}

/* ---------- touch controls ---------- */
#touch{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;padding:0 calc(var(--safe-r) + 20px) calc(var(--safe-b) + 22px) calc(var(--safe-l) + 20px);pointer-events:none}
#touch .grp{display:flex;gap:16px;pointer-events:auto}
.tbtn{pointer-events:auto;width:clamp(78px,17vmin,112px);height:clamp(78px,17vmin,112px);border-radius:50%;background:rgba(255,248,232,.55);border:4px solid rgba(37,38,74,.85);box-shadow:0 6px 0 rgba(37,38,74,.85);display:flex;align-items:center;justify-content:center;touch-action:none;transition:transform .06s,background .06s}
.tbtn svg{width:46%;height:46%;fill:var(--ink)}
.tbtn.jump{width:clamp(96px,22vmin,140px);height:clamp(96px,22vmin,140px);background:rgba(255,107,107,.7)}
.tbtn.jump svg{fill:#fff}
.tbtn.down{transform:translateY(5px);box-shadow:0 1px 0 rgba(37,38,74,.85);background:rgba(255,209,102,.9)}

/* ---------- level complete ---------- */
.bigstars{display:flex;gap:6px;align-items:flex-end;margin:4px 0}
.bigstars .s{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:800;max-width:96px;line-height:1.1}
.bigstars svg{width:clamp(56px,10vh,84px);height:clamp(56px,10vh,84px);transform:scale(.4);opacity:.25}
.bigstars .s.on svg{animation:starin .55s cubic-bezier(.2,1.6,.4,1) forwards;animation-delay:var(--d)}
.bigstars .s.on path{fill:var(--sunny)}.bigstars .s path{fill:#E2DDD0;stroke:var(--ink);stroke-width:2.4;stroke-linejoin:round}
.bigstars .s.mid svg{margin-bottom:10px}
@keyframes starin{0%{transform:scale(.2) rotate(-40deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
.bigstars .s:not(.on) svg{transform:scale(.8);opacity:.5}
.stats{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;font-weight:800;font-size:17px}
.badge{background:var(--coral);color:#fff;border:3px solid var(--ink);border-radius:14px;padding:2px 12px;font-weight:900;font-size:15px;transform:rotate(-3deg)}

/* ---------- transitions ---------- */
#wipe{position:absolute;inset:0;background:var(--purple);pointer-events:none;clip-path:circle(0% at 50% 50%);transition:clip-path .38s cubic-bezier(.6,0,.4,1)}
#wipe.on{clip-path:circle(150% at 50% 50%)}
#rotate{display:none}
@media (max-width:720px){.btn{padding:.3em 1em}}
@media (prefers-reduced-motion:reduce){.btn.big,.btn:hover{animation:none!important;transform:none}.logo span,.screen{animation:none!important}}

.fly{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;pointer-events:none;z-index:4;transition:transform .55s cubic-bezier(.5,-.2,.7,1),opacity .55s;filter:drop-shadow(0 2px 0 rgba(37,38,74,.6))}
.fly svg{width:100%;height:100%}.fly path{fill:currentColor;stroke:#25264A;stroke-width:2.4;stroke-linejoin:round}

#c-mascot{width:clamp(90px,16vh,130px);height:clamp(90px,16vh,130px);margin:-8px 0 -4px}
.stats span{background:#fff;border:2.5px solid var(--ink);border-radius:14px;padding:1px 10px}
</style>
</head>
<body>
<div id="app">
  <canvas id="game" aria-label="ZUPI game"></canvas>

  <!-- in-game HUD: a slim bar ABOVE the play field (the canvas starts below it), so nothing here covers gameplay -->
  <div id="hud" class="hidden">
    <div class="bar">
      <div class="left">
        <div class="pill" id="hud-level">1</div>
        <div class="pill" id="hud-stars"><svg viewBox="0 0 24 24"><path d="M12 2l3 6.6 7.2.8-5.4 4.9 1.5 7.1L12 17.7 5.7 21.4l1.5-7.1L1.8 9.4 9 8.6z" fill="#FFD166" stroke="#25264A" stroke-width="2" stroke-linejoin="round"/></svg><b>0/0</b></div>
        <div class="pill skull" id="hud-deaths" title="Oopsies"><svg viewBox="0 0 24 24"><path d="M12 2.5c-4.7 0-8 3.2-8 7.6 0 2.7 1.3 4.6 3 5.8V20h10v-4.1c1.7-1.2 3-3.1 3-5.8 0-4.4-3.3-7.6-8-7.6z" fill="#FFF8E8" stroke="#25264A" stroke-width="2" stroke-linejoin="round"/><circle cx="8.8" cy="11" r="2" fill="#25264A"/><circle cx="15.2" cy="11" r="2" fill="#25264A"/><path d="M10 16.5v2.5M14 16.5v2.5" stroke="#25264A" stroke-width="1.6" stroke-linecap="round"/></svg><b>0</b></div>
        <div class="pill gem" id="hud-gems"><svg viewBox="0 0 24 24"><path d="M12 2l8 8-8 12L4 10z" stroke="#25264A" stroke-width="2" stroke-linejoin="round"/></svg><b>0/1</b></div>
      </div>
      <div class="mid"><div class="pill" id="objective"></div><div id="toast"></div></div>
      <div class="right">
        <button class="btn round cream" id="btn-restart" aria-label="Restart level" title="Restart (R)">↻</button>
        <button class="btn round coral" id="btn-pause" aria-label="Pause" title="Pause (Esc)">❚❚</button>
      </div>
    </div>
    <div id="tip" class="hidden" role="note"><span class="ic">💡</span><span id="tip-text"></span><button id="tip-x" aria-label="Dismiss tip">×</button></div>
  </div>
  <div id="touch" class="hidden">
    <div class="grp">
      <button class="tbtn" id="t-left" aria-label="Move left"><svg viewBox="0 0 24 24"><path d="M15.5 3.5 6 12l9.5 8.5V3.5z"/></svg></button>
      <button class="tbtn" id="t-right" aria-label="Move right"><svg viewBox="0 0 24 24"><path d="M8.5 3.5 18 12l-9.5 8.5V3.5z"/></svg></button>
    </div>
    <button class="tbtn jump" id="t-jump" aria-label="Jump"><svg viewBox="0 0 24 24"><path d="M12 3l9 12h-6v6H9v-6H3z"/></svg></button>
  </div>

  <!-- main menu -->
  <section id="menu" class="screen">
    <div class="logo" aria-label="ZUPI"><span style="--i:0;--c:#FF6B6B">Z</span><span style="--i:1;--c:#FFD166">U</span><span style="--i:2;--c:#56CFE1">P</span><span style="--i:3;--c:#8BD17C">I</span></div>
    <canvas id="mascot" width="400" height="400" aria-hidden="true"></canvas>
    <div class="tagline">Bounce. Play. Repeat.</div>
    <div class="col">
      <button class="btn big coral" id="m-play">▶ PLAY</button>
      <div class="row">
        <button class="btn blue" id="m-levels">Levels</button>
        <button class="btn mint" id="m-settings">Settings</button>
      </div>
    </div>
    <div class="row">
      <button class="btn round cream" id="m-sfx" aria-label="Toggle sound effects" title="Sound effects">🔊</button>
      <button class="btn round cream" id="m-music" aria-label="Toggle music" title="Music">♪</button>
    </div>
  </section>

  <!-- level select -->
  <section id="levels" class="screen hidden dim">
    <div class="panel">
      <h2>Choose a level</h2>
      <div id="level-list" style="display:flex;flex-direction:column;gap:14px;width:100%"></div>
      <button class="btn" id="l-back">← Back</button>
    </div>
  </section>

  <!-- settings -->
  <section id="settings" class="screen hidden dim">
    <div class="panel" style="width:min(92vw,460px)">
      <h2>Settings</h2>
      <div class="setting"><span>Sound effects</span><input type="range" id="s-sfxvol" min="0" max="100" aria-label="Effects volume"><button class="switch" id="s-sfx" role="switch" aria-checked="true" aria-label="Sound effects"></button></div>
      <div class="setting"><span>Music</span><input type="range" id="s-musvol" min="0" max="100" aria-label="Music volume"><button class="switch" id="s-music" role="switch" aria-checked="true" aria-label="Music"></button></div>
      <div class="keys"><kbd>A</kbd>/<kbd>D</kbd> or <kbd>←</kbd>/<kbd>→</kbd> move · <kbd>Space</kbd>/<kbd>W</kbd>/<kbd>↑</kbd> jump (hold = higher)<br><kbd>Esc</kbd> pause · <kbd>R</kbd> restart · Touch: on-screen buttons</div>
      <div class="row"><button class="btn coral" id="s-reset">Reset progress</button><button class="btn" id="s-back">← Back</button></div>
      <p class="sub" id="s-note"></p>
    </div>
  </section>

  <!-- pause -->
  <section id="pause" class="screen hidden dim">
    <div class="panel">
      <h2>Paused</h2>
      <div class="col">
        <button class="btn big mint" id="p-resume">▶ Resume</button>
        <button class="btn blue" id="p-restart">↻ Restart</button>
        <button class="btn cream" id="p-menu">☰ Levels</button>
      </div>
      <div class="row"><button class="btn round cream" id="p-sfx" aria-label="Toggle sound effects">🔊</button><button class="btn round cream" id="p-music" aria-label="Toggle music">♪</button></div>
    </div>
  </section>

  <!-- level complete -->
  <section id="complete" class="screen hidden">
    <div class="panel">
      <canvas id="c-mascot" width="260" height="260" aria-hidden="true"></canvas>
      <h2 id="c-title">Level complete!</h2>
      <p class="sub" id="c-name"></p>
      <div class="bigstars" id="c-stars"></div>
      <div class="badge hidden" id="c-badge">NEW BEST!</div>
      <div class="stats" id="c-stats"></div>
      <p class="sub hidden" id="c-unlock"></p>
      <div class="col">
        <button class="btn big mint" id="c-next">Next level ▶</button>
        <div class="row"><button class="btn blue" id="c-replay">↻ Replay</button><button class="btn cream" id="c-menu">☰ Levels</button></div>
      </div>
    </div>
  </section>

  <!-- confirm -->
  <section id="confirm" class="screen hidden dim" style="z-index:5">
    <div class="panel" role="alertdialog" aria-labelledby="cf-t">
      <h2 id="cf-t">Erase all progress?</h2>
      <p class="sub">Your stars and unlocked levels will be wiped. Sou
